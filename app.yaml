kind: wasmer.io/App.v0
owner: zihadza
name: my-php-api
package: .

# Eksathe onek request handle korar jonno auto-scaling
scaling:
  mode: single_concurrency

# 1 GB Persistent Storage (/data folder-e file save thakbe, harabe na)
volumes:
  - name: uploads-storage
    mount: /data

# Managed MySQL v8.4 Database
capabilities:
  database:
    engine: mysql

# API Security Key (Chaile pore nijer moto change korte paro)
env:
  API_SECRET: "zihad-secret-key-2026"
